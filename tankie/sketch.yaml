# Arduino sketch project file (arduino-cli / Arduino IDE 2.x).
#
# Pins the ESP8266 core (3.1.2) and the sketch's external libraries so the
# build is reproducible. The FQBN is pinned in `fqbn`/`platforms`; note the
# flag below is NOT settable in this file (see README "Build & flash").
profiles:
  tankie:
    fqbn: esp8266:esp8266:d1_mini
    platforms:
      - platform: esp8266:esp8266 (3.1.2)
    libraries:
      - ElegantOTA (4.0.0)
      - AsyncTCP (1.1.4)
      - ESPAsyncTCP (1.2.4)
      - ESPAsyncWebServer (3.1.0)
      - Servo (1.3.0)
    # Note: ElegantOTA must run in async mode (clash with the core's
    # WebServer HTTP_GET enum). Set at build time per toolchain (README):
    # -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
