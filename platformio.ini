[platformio]
# The sketch + web UI sources live in tankie/ (no restructuring — see
# issue #17 A6). Point PlatformIO at them instead of moving files.
src_dir = tankie
data_dir = tankie/data

[env:tankie]
platform = espressif8266
board    = d1_mini                  ; Wemos D1 Mini / LOLIN D1 R2 & mini
framework = arduino
monitor_speed = 921600              ; matches the serial protocol (issue #29)

# LittleFS (matches the firmware and raspberry_pi/build.sh).
# The d1_mini board defaults to eagle.flash.4m1m.ld (FS:1MB) — the project
# runs on the 4M / FS:2MB layout (2072576 bytes, FS @ 0x200000) so the
# on-chip filesystem and the built image agree.
board_build.filesystem = littlefs
board_build.ldscript   = eagle.flash.4m2m.ld

# ElegantOTA + the core's built-in WebServer both define an HTTP_GET enum ->
# clash. This global flag (set at build time) switches ElegantOTA to the
# async web stack and resolves it. Required in every build path.
build_flags =
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1

# Pinned external libraries (same versions raspberry_pi/build.sh / CI use).
# Note: the ESP8266 core bundles its own interrupt-driven Servo, so it does
# not go in lib_deps (the generic arduino-libraries/Servo does not support
# ESP8266).
lib_deps =
    ayushsharma82/ElegantOTA @ 4.0.0
    esp32async/ESPAsyncWebServer @ >=3.1.0
    esp32async/ESPAsyncTCP @ >=1.1.4
