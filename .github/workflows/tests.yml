# CI for the Tankie ESP8266 firmware (issue #5).
#
# 8 jobs, all on push/PR:
#
#   unit-tests     - host-side unit tests (g++, no ESP toolchain): compiles
#                    the pure firmware modules against tests/shims/Arduino.h
#                    and runs the assertion suite (tests/run_tests.sh).
#
#   web-ui         - the web-UI JSON-protocol harness (Node, no browser):
#                    drives the REAL tankie/data/script.js in a VM sandbox
#                    and asserts the contract shapes + the stream-URL button
#                    behaviour (issue #32, #51). This is the only automated
#                    guard for script.js, so it runs in CI (issue #51, A5).
#
#   go-checks      - the Go module guards (issue #19): gofmt -l + go vet +
#                    go build + go test on ai-control/tankieControl, the only
#                    real Go module (ai-control/functions/ has no go.mod).
#
#   python-checks  - the Python guards (issue #19): py_compile the LocalAI
#                    client + a pip install -r requirements.txt smoke.
#   brain-tests    - the brain package guard (issue #75, T4): pip install
#                    the brain requirements + compileall the package +
#                    pytest tests/brain/ --strict-markers (fully offline —
#                    no tank/Pi/LocalAI). Separate from python-checks so the
#                    legacy client guard stays independent (issue #75).
#
#   firmware-build - builds the REAL firmware with raspberry_pi/build.sh
#                    (arduino-cli + esp8266 core 3.1.2, esp8266:esp8266:d1_mini,
#                    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1) — firmware AND the
#                    LittleFS data partition — exactly the build the tank Pi
#                    runs (PR #25, #29).
#   platformio-build - builds with PlatformIO (platformio.ini)
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host compiler
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Run host unit tests
        run: bash tests/run_tests.sh

  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js (for the web-UI harness)
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the web-UI JSON-protocol harness (issue #32, #51)
        run: node tests/web_ui_harness.js

  go-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Go (pinned to the go.mod requirement)
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: gofmt (fail on unformatted)
        # ai-control/functions/ is NOT a Go module (no go.mod, no package
        # clause - it's a LocalAGI function plugin), so the guard must run
        # inside the real module: ai-control/tankieControl. `go build ./...`
        # from the repo root fails with "cannot find main module."
        working-directory: ai-control/tankieControl
        run: |
          out=$(gofmt -l .)
          test -z "$out" || { echo "gofmt reported:"; echo "$out"; exit 1; }
      - name: go vet + go build
        working-directory: ai-control/tankieControl
        run: |
          go vet ./...
          go build ./...
      - name: go test
        working-directory: ai-control/tankieControl
        run: go test ./...

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: py_compile the AI control client
        run: python -m py_compile ai-control/LocalAI/ai_control.py
      - name: requirements.txt smoke (pip install)
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install -r ai-control/LocalAI/requirements.txt

  brain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install brain dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r raspberry_pi/brain/requirements.txt
      - name: Compile-check the brain package (all modules that exist)
        # compileall over the package directory — so the job keeps working as
        # Phase 2+ adds modules (reflex.py / deliberate.py / mcp_server.py)
        # without editing this job (issue #75).
        run: python -m compileall -q raspberry_pi/brain
      - name: Run the brain test suite
        # tests/run_brain_tests.sh is the single source of truth for the
        # pytest command — CI and a human on a dev machine run the exact
        # same line (issue #75).
        run: bash tests/run_brain_tests.sh

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install arduino-cli (pinned release binary)
        # arduino/setup-arduino-cli@v1 is broken upstream: with "latest" its
        # tag resolution matches zero versions and the step dies with
        # "unable to get latest version" before any compile happens (issue
        # #29, 2026-09-29). Install the pinned release binary directly
        # instead — the same source raspberry_pi/setup.sh uses.
        run: |
          ARDUINO_CLI_VERSION=1.5.1
          curl -fsSL -o /tmp/arduino-cli.tar.gz \
            "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          sudo mkdir -p /opt/arduino-cli
          sudo tar -xzf /tmp/arduino-cli.tar.gz -C /opt/arduino-cli
          sudo ln -sf /opt/arduino-cli/arduino-cli /usr/local/bin/arduino-cli
          arduino-cli version
      - name: Install the esp8266 core (pinned)
        run: |
          arduino-cli config add board_manager.additional_urls http://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2
      - name: Install the external libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install ElegantOTA@4.0.0   # pinned: flash_ota.sh needs the 4.x /ota/metadata API (issue #44 D)
          arduino-cli lib install ESPAsyncWebServer
          arduino-cli lib install AsyncTCP
          arduino-cli lib install Servo
      - name: Build firmware + data partition (raspberry_pi/build.sh)
        # The exact script the tank Pi uses: same FQBN and flags, and it
        # also builds the LittleFS data partition image (tankie/data/).
        run: bash raspberry_pi/build.sh
      - name: Check the firmware + data partition binaries
        run: |
          ls -l /tmp/tankie-flash/tankie.ino.bin /tmp/tankie-flash/tankie.ino.data.bin
          test -s /tmp/tankie-flash/tankie.ino.bin
          test -s /tmp/tankie-flash/tankie.ino.data.bin

  pi-install-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the static Pi install guard (issue #53)
        run: bash tests/pi_install_check.sh
      - name: Run the wlan0-watchdog harness (issue #68)
        run: bash tests/wlan0_watchdog_harness.sh

  platformio-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PlatformIO (isolated venv)
        run: |
          # PlatformIO installs to the venv; the /usr/local/bin/pio wrapper is
          # NOT installed with it, so always use the full venv path.
          python3 -m venv /tmp/pioenv
          /tmp/pioenv/bin/pip install platformio
      - name: Build firmware with PlatformIO
        run: |
          /tmp/pioenv/bin/pio run
      - name: Build LittleFS data partition with PlatformIO
        run: |
          /tmp/pioenv/bin/pio run -t buildfs
      - name: Check the binaries
        run: |
          ls -l .pio/build/tankie/*.bin
          test -s .pio/build/tankie/firmware.bin
          test -s .pio/build/tankie/littlefs.bin
