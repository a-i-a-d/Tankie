# Tankie AI brain configuration (issue #72, Phase 1 T1).
#
# Single config source for the brain (D10/D19). Precedence, highest wins:
#   env var > this file > built-in defaults (raspberry_pi/brain/config.py)
#
# The brain NEVER crashes on config: a missing/corrupt file falls back to
# the defaults in config.py. Only the keys you want to change need to be
# here; everything else stays at its default.
#
# No IP addresses are required in code (A4): the code default for LocalAI is
# the dnsmasq hostname `localai.local`. This file MAY carry the static IP as
# a local override until dnsmasq is set up on the Pi (#69 A4 follow-up) —
# that is why `localai_base_url` below is a static IP today.

# --- LocalAI server (A1: inference on the LocalAI server, not the Pi) ---
localai_base_url: http://192.168.178.10:8080/v1   # local override (A4); code default is http://localai.local:8080/v1
localai_api_key: "sk-0123456789"                   # LocalAI accepts any key (or none)

# --- models (all configurable — switch and re-test easily; none are hardcoded in code) ---
vlm_model: ornith-1.5-9b-obliterated-q4  # issue #81 Q1 (A1): benchmark-best vision VLM (configurable — switch + re-test easily)
detection_model: rfdetr-base             # Q1 (#73): detector for POST /v1/detection (configurable)
stt_model: whisper-1                     # Q3 (#73): speech-to-text (confirmed deployed)
tts_model: qwen3-tts-0.6b-custom-voice   # Q3 (#73): text-to-speech default (configurable)

# --- loop rates (D3: reflex 10 Hz, deliberate 1-5 Hz) ---
reflex_hz: 10
deliberate_hz: 1                # conservative start; raise once the loop is stable

# --- deliberation loop (T5, #81) — the slow thinker (System 2) ---------
# A1 (#81): a short *sequence* of frames per VLM call so it can infer
# motion. 1-4; the frame grabber's ring buffer is sized to this.
deliberate_frames: 4
# A2 (#81): the VLM prompts are fully configurable — edit here to change
# the phrasing without touching code. {task} and {state} are the only
# placeholders in the user template (both always provided).
deliberate_system_prompt: |
  You are the deliberation layer of a tank robot.
  You receive camera frames, the current task, and the tank state.
  Decide the next action. Respond with a single JSON object:
  {"intent": "go_to|find|explore|stop|say|wait",
   "cmd": "drive|pan|tilt|stop|none",
   "speed": <int -100..100>, "steer": <int -255..255>,
   "pan": <int 0..180 or null>, "tilt": <int 0..180 or null>,
   "say": "<what to say, optional>", "reason": "<why>"}
  The reflex safety layer will clamp and may override. Focus on the task.
deliberate_user_prompt_template: |
  Current task: {task}
  Tank state: {state}
  Decide the next action and respond with the JSON object.

# --- camera (D5: LL-HLS cam_low is the brain's frame source) ---
cam_url: http://tankie.local:8888/cam_low/index.m3u8   # LL-HLS; rtsp://tankie.local:8554/cam_low is the fallback

# --- frame grabber (T3, #74) ---
# How often FrameGrab polls the source, and how old a frame may be before
# read_latest() reports it dead (None). The HTTP fallback (Q2 option (a))
# polls the LL-HLS playlist every grab_http_poll_s with a grab_http_timeout_s
# per-request timeout.
grab_interval_s: 0.2
grab_stale_after_s: 3.0
grab_http_poll_s: 0.5
grab_http_timeout_s: 2.0

# --- reflex loop (T4, #80) — the safety net ------------------------------
# A2 (#80): detection-only obstacle avoidance is implemented but DISABLED by
# default until depth (T15) lands; flip to true to test it now.
reflex_obstacle_enabled: false
# A1 (#80): COCO classes that threaten the tank (configurable list).
reflex_block_classes: [person, car, truck, bus, bicycle, motorcycle, dog, cat, horse]
# A2 (#80): geometry — box center within +/-30% of image center x is "in the
# lane"; box bottom below 70% of image height is "close".
reflex_lane_half_width: 0.30
reflex_min_bottom_ratio: 0.70
# A3 (#80): steer magnitude (±) when avoiding a side-lane obstacle.
reflex_steer_around: 60

# --- serial bridge (#33) ---
bridge_socket: /run/tankie/bridge.sock
state_file: /var/lib/tankie/state.json

# --- task file (T6, #82; Q5/A5) ---
# The cross-process task channel: brain_cli.py / the MCP server write the
# task here; Brain polls it into the in-memory TaskQueue each tick.
task_file: /var/lib/tankie/task.json

# --- data log (Phase 6 training/benchmark artifact) ---
data_log_dir: /var/lib/tankie/brain
data_log_max_mb: 10
data_log_keep: 5

# --- MCP (#69 D: MCP server on the Pi, Phase 3) ---
mcp_port: 9000

# --- autonomous drive profile (issue #31; the bridge enforces, this is the UX mirror) ---
auto_profile:
  enabled: true
  max_speed: 40
  max_steer: 255

# --- per-call timeouts (seconds) for the LocalAI client (T2) ---
# chat_s: short timeout for health() (liveness probe) and other fast endpoints.
# vlm_chat_s: dedicated timeout for the VLM chat() call — the 9B model takes
#   ~7 s warm and much longer cold (issue #100); 60 s gives ample headroom.
timeouts:
  chat_s: 5.0
  vlm_chat_s: 60.0
  detect_s: 1.0
  transcribe_s: 10.0
  speak_s: 10.0
