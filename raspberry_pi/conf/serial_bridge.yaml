# Tankie serial bridge configuration (issue #29).
# Single config source for the Pi-side serial control link (per #16).
#
# The ESP8266 firmware uses the matching compile-time constants in
# tankie/config_serial.h (SERIAL_PROTO_BAUD, SERIAL_WATCHDOG_MS).
# Keep the two in sync when changing baud or watchdog timing.

serial_port: /dev/ttyS0
# NOTE: the control link uses the Pi's native UART0 (GPIO14 TX / GPIO15 RX,
# wired directly to the ESP8266 TX/RX). /dev/ttyUSB0 was the temporary
# USB/CH340 flashing adapter and is NOT the control link (see README).
baud: 921600

# Keep-alive: the bridge re-sends the active drive command at this interval
# so the ESP8266 watchdog (SERIAL_WATCHDOG_MS = 1000 ms) never fires while
# the tank is supposed to be moving. 250 ms gives 4× margin.
keepalive_ms: 250

# Link-down detection: if no ack is received within this window after a
# command, the link is considered down and the state file is updated.
ack_timeout_ms: 500

# State store: written by the bridge, read by the CLI and (future) Web UI.
state_file: /var/lib/tankie/state.json

# Unix socket: the CLI sends commands to the bridge daemon over this socket.
socket_path: /run/tankie/bridge.sock

# Log level: DEBUG, INFO, WARNING, ERROR
log_level: INFO

# Issue #51: the stream endpoint the bridge pushes to the ESP via the
# set_stream command. The Pi owns the camera + mediamtx, so it is the only
# component that knows its own (dynamic) IP; it detects it at runtime and
# sends it here so the ESP web UI can point the video iframe at the correct
# address (no more hard-coded http://10.42.0.1:8889/cam/).
#   stream_port - the mediamtx WebRTC port (conf/mediamtx.yml webrtcAddress)
#   stream_path - the mediamtx path for the human stream (conf/mediamtx.yml)
stream_port: 8889
stream_path: /cam/

# ---------------------------------------------------------------------------
# Autonomous drive profile (issue #31)
#
# Speed/steer limits enforced in the bridge for AI-driven motion. The ESP
# cannot distinguish AI from manual traffic (both arrive as `drive`), so the
# bridge is the enforcement layer. Manual (CLI / Web UI) traffic is NOT
# clamped — only the AI path (via ai_control.py) is.
#
# The 250 ms keep-alive re-sends the CLAMPED values, so the ESP never sees
# an over-limit value from the AI path.
#
# Set enabled: false to disable clamping (all traffic passes through at
# full ±255).
# ---------------------------------------------------------------------------
auto_profile:
  enabled: true
  max_speed: 40      # AI speed limit (manual stays ±255)
  max_steer: 120     # AI steer limit (manual stays ±255)
