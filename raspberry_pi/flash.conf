# ---------------------------------------------------------------------------
# Tankie ESP8266 flash configuration — the single source of truth shared by
# flash_serial.sh (USB/CH340 download-mode flash) and flash_ota.sh (OTA over
# WiFi, issue #44 D). Sourced by both scripts; every value can be overridden
# from the environment (a value already in the env wins over the default here)
# and, on the tank, by /etc/tankie/flash.env (written by setup.sh).
#
# Defaults (per issue #44):
#   serial port  /dev/ttyUSB0
#   serial speed 115200          (the esptool flash speed flash.sh used)
#   ota url      http://192.168.4.1/update   (ElegantOTA portal, tankie-esp AP)
# ---------------------------------------------------------------------------

# --- USB / serial flash (flash_serial.sh) ----------------------------------
FLASH_SERIAL_PORT="${FLASH_SERIAL_PORT:-/dev/ttyUSB0}"
FLASH_SERIAL_BAUD="${FLASH_SERIAL_BAUD:-115200}"

# --- OTA over WiFi (flash_ota.sh) ------------------------------------------
# The ElegantOTA portal URL (browser). flash_ota.sh derives the API base from
# this (scheme://host[:port]) and calls /ota/metadata, /ota/start and
# /ota/upload against it.
OTA_URL="${OTA_URL:-http://192.168.4.1/update}"

# The fallback access point the ESP opens when it has no saved WiFi (used by
# tests/manual/flash_ota_test.sh to connect the tank Pi to the ESP before an OTA upload).
OTA_AP_SSID="${OTA_AP_SSID:-tankie-esp}"
OTA_AP_PASSWORD="${OTA_AP_PASSWORD:-tankie1234}"

# Also OTA the LittleFS data partition (tankie.ino.data.bin, the web UI) in
# the same run as the firmware. Set to "false" to flash firmware only.
OTA_UPDATE_FILESYSTEM="${OTA_UPDATE_FILESYSTEM:-true}"

# How long to wait (seconds) for the ESP to come back after an OTA reboot
# before declaring the update verified.
OTA_REBOOT_TIMEOUT="${OTA_REBOOT_TIMEOUT:-60}"
